[project]
name = "voxclip"
version = "0.2.5"
description = "Ubuntu desktop voice dictation helper that copies transcriptions to the clipboard."
authors = [{name = "Vincent Elkouby"}]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "keyring>=25.7",
    "numpy>=2.3",
    "platformdirs>=4.5",
    "pydantic>=2.12",
    "PySide6-Essentials>=6.10",
    "sounddevice>=0.5",
    "tomli-w>=1.2",
    "websockets>=15.0",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Home = "https://github.com/velkouby/voxclip"
"Issue Tracker" = "https://github.com/velkouby/voxclip/issues"
"Author Contact" = "https://github.com/velkouby"

[project.scripts]
voxclip = "vox_voice_paste.main:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "PySide6>=6.10",
    "pytest>=8.4",
    "pytest-qt>=4.5",
    "ruff>=0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vox_voice_paste"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
